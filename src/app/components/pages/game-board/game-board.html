<div class="header">
  <div class="logo">
    <img src="assets/images/logo.png" alt="Logo">
  </div>
  <div class="game-info">
    <h1>{{ gameName }}</h1>
  </div>
  <div class="invite-button">
    <button>Invitar jugadores</button>
  </div>
</div>

<div class="board-container">
  <div class="player-card">
    <span class="initials">{{ userName.charAt(0) | uppercase }}</span>
    <p>{{ userName }}</p>
  </div>
</div>
