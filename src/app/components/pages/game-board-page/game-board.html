<div class="game-board">
  <app-header
    [gameName]="gameName"
    [userName]="userName"
    [userRole]="userRole"
    [displayMode]="displayMode"
    (displayModeChange)="displayMode = $event"
  ></app-header>
  <app-board
    [userName]="userName"
    [userRole]="userRole"
    [displayMode]="displayMode"
    (displayModeChange)="onDisplayModeChange($event)">
  ></app-board>
</div>
